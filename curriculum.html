    <script>

            App.init();

    <script src="static/assets/js/custom.js"></script>
    <script>
        function loadCurriculum() {
            $.get('/curriculum', function (data) {
                const tableBody = $('#curriculumTable tbody');
                tableBody.empty();
                Object.entries(data).forEach(([semester, subjects]) => {
                    subjects.forEach(subject => {
                        tableBody.append(`
          <tr>
            <td>${semester}</td>
            <td><input class="form-control form-control-sm" value="${subject}" data-sem="${semester}" data-old="${subject}"></td>
            <td>
              <button class="btn btn-primary btn-sm" onclick="updateSubject(this)">Update</button>
              <button class="btn btn-danger btn-sm" onclick="deleteSubject('${semester}', '${subject}')">Delete</button>
            </td>
          </tr>
        `);
                    });
                });
                $('#curriculumTable').DataTable();
            });
        }

        function updateSubject(btn) {
            var row = $(btn).closest('tr');
            var input = row.find('input');
            var sem = input.data('sem');
            var oldSub = input.data('old');
            var newSub = input.val();

            if (!newSub) {
                Swal.fire('Error', 'Subject name cannot be empty', 'error');
                return;
            }

            $.ajax({
                url: '/curriculumupdate',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    semester: sem,
                    old_subject: oldSub,
                    new_subject: newSub
                }),
                success: function (response) {
                    Swal.fire('Updated!', '', 'success');
                    $('#curriculumTable').DataTable().destroy();
                    loadCurriculum();
                },
                error: function (xhr, status, error) {
                    Swal.fire('Error', 'Update failed', 'error');
                }
            });
        }

        function deleteSubject(sem, subject) {
            Swal.fire({
                title: `Delete "${subject}"?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, delete'
            }).then(result => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: '/curriculumdelete',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({ semester: sem, subject }),
                        success: () => { Swal.fire('Deleted!', '', 'success'); $('#curriculumTable').DataTable().destroy(); loadCurriculum(); },
                        error: () => Swal.fire('Error', 'Delete failed', 'error')
                    });
                }
            });
        }

        $(document).ready(() => {
            $('#addSubjectForm').off('submit').on('submit', function (e) {
                e.preventDefault();
                const sem = $('#addSemester').val();
                const sub = $('#addSubject').val().trim();
                if (!sub) return Swal.fire('Error', 'Enter subject name', 'error');

                $.ajax({
                    url: window.location.origin + '/curriculumadd',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ semester: sem, subject: sub }),
                    success: () => {
                        $('#addSubjectModal').modal('hide');
                        Swal.fire('Added!', '', 'success');
                        $('#curriculumTable').DataTable().destroy();
                        loadCurriculum();
                    },
                    error: (xhr) => {
                        Swal.fire('Error', xhr.responseJSON?.message || 'Add failed', 'error');
                    }
                });
            });
        });
        $(document).ready(() => {
            loadCurriculum();
        });
    </script>
    <!-- END GLOBAL MANDATORY SCRIPTS -->
    <div class="modal fade" id="addSubjectModal" tabindex="-1" role="dialog" aria-labelledby="addModalLabel"

                        </button>
                    </div>
                    <div class="modal-body">
                        <label>Semester</label>
                        <select id="addSemester" class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                        <label class="mt-2">Subject</label>
                        <input type="text" id="addSubject" class="form-control" required>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary" id="submitSubject">Add Subject</button>
                    </div>
                </form>
            </div>
        </div>
