    <script src="static/assets/js/custom.js"></script>
    <script>
        let studentTable;
        function loadStudents() {
            $.get('/students', function (data) {
                const tbody = $('#studentsTable tbody');
                tbody.empty();

                if ($.fn.DataTable.isDataTable('#studentsTable')) {
                    $('#studentsTable').DataTable().clear().destroy();  // ✅ Ensures full reset
                }

                data.forEach(row => {
                    tbody.append(`
                <tr>
                  <td>${row.usn}</td>
                  <td>${row.name}</td>
                  <td>${row.semester}</td>
                  <td><input class="form-control form-control-sm" value="${row.subject}" data-old="${row.subject}"></td>
                  <td><input class="form-control form-control-sm" value="${row.attendance}"></td>
                  <td><input class="form-control form-control-sm" value="${row.internal1}"></td>
                  <td><input class="form-control form-control-sm" value="${row.internal2}"></td>
                  <td><input class="form-control form-control-sm" value="${row.internal3}"></td>
                  <td><input class="form-control form-control-sm" value="${row.assignment}"></td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="viewStudentStatus('${row.usn}')">
                            View Status
                        </button>
                    </td>
                  <td>
                    <button class="btn btn-sm btn-primary" onclick="updateStudent(this, '${row.usn}', '${row.name}', '${row.semester}')">Update</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteStudent('${row.usn}', '${row.semester}', '${row.subject}')">Delete</button>
                  </td>
                  
                </tr>
            `);
                });

                studentTable = $('#studentsTable').DataTable({
                    scrollX: true
                });

                $('#semesterFilter').off().on('change', function () {
                    const val = this.value;
                    studentTable.column(2).search(val).draw();
                });
            });
        }
        function updateStudent(btn, usn, name, semester) {
            const row = $(btn).closest('tr');
            const inputs = row.find('input');
            const old_subject = $(inputs[0]).data('old');
            const new_subject = $(inputs[0]).val();
            const attendance = $(inputs[1]).val();
            const internal1 = $(inputs[2]).val();
            const internal2 = $(inputs[3]).val();
            const internal3 = $(inputs[4]).val();
            const assignment = $(inputs[5]).val();

            $.ajax({
                url: '/students/update',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    usn, name, semester, old_subject, new_subject,
                    attendance, internal1, internal2, internal3, assignment
                }),
                success: function () {
                    Swal.fire('Updated!', '', 'success');
                    loadStudents();
                },
                error: function () {
                    Swal.fire('Error', 'Update failed', 'error');
                }
            });
        }

        function deleteStudent(usn, semester, subject) {
            Swal.fire({
                title: 'Confirm delete?',
                showCancelButton: true,
                confirmButtonText: 'Delete'
            }).then(result => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: '/students/delete',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({ usn, semester, subject }),
                        success: () => {
                            Swal.fire('Deleted!', '', 'success');
                            loadStudents();
                        },
                        error: () => Swal.fire('Error', 'Delete failed', 'error')
                    });
                }
            });
        }

        $(document).ready(() => {

            $('#addStudentForm').off('submit').on('submit', function (e) {
    e.preventDefault();

    const selectedSubject = $('#subject').val();
    const validSubjects = $('#subjectList option').map(function () {
        return this.value;
    }).get();

    if (!validSubjects.includes(selectedSubject)) {
        Swal.fire('Invalid Subject', 'Please select a subject from the list.', 'error');
        return;
    }

    const payload = {
        usn: $('#usn').val(),
        name: $('#name').val(),
        semester: $('#semester').val(),
        subject: selectedSubject,
        attendance: $('#attendance').val(),
        internal1: $('#internal1').val(),
        internal2: $('#internal2').val(),
        internal3: $('#internal3').val(),
        assignment: $('#assignment').val()
    };

    $.ajax({
        url: '/students/add',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(payload),
        success: () => {
            $('#addModal').modal('hide');
            Swal.fire('Added!', '', 'success');
            $('#addStudentForm')[0].reset();
            loadStudents();
        },
        error: (e) => Swal.fire('Error', e.responseJSON.message, 'error')
    });
});


        });
        $(document).ready(() => {
    loadStudents();

    $('#semester').on('change', function () {
        const semester = $(this).val();

        if (semester) {
            $.get(`/subjects/${semester}`, function (data) {
                const datalist = $('#subjectList');
                datalist.empty();

                data.subjects.forEach(subject => {
                    datalist.append(`<option value="${subject}">`);
                });

                $('#subject').prop('disabled', false);
            });
        } else {
            $('#subject').prop('disabled', true);
        }
    });
});


        function viewStudentStatus(usn) {
            const newWindow = window.open(`/status/${usn}`, '_blank');
        }

        function trainModel() {
            Swal.fire({
                title: 'Are you sure?',
                text: "This will retrain the ML model with the latest data.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, Train It!'
            }).then((result) => {
                if (result.isConfirmed) {

                    Swal.fire({
                        title: 'Training Model...',
                        html: 'Please wait while the model is being trained.',
                        allowOutsideClick: false,
                        didOpen: () => {
                            Swal.showLoading();
                        }
                    });

                    $.ajax({
                        url: '/train-model',
                        method: 'POST',
                        success: function (res) {
                            Swal.fire('✅ Success', res.message, 'success');
                        },
                        error: function (xhr) {
                            Swal.fire('❌ Error', xhr.responseJSON?.message || 'Training failed', 'error');
                        }
                    });
                }
            });
        }
    </script>

    <div class="modal fade" id="addModal" tabindex="-1">

                <div class="modal-body">

                    <input class="form-control mb-2" placeholder="Name" id="name" required><br>
                    <select id="semester" class="form-control form-select w-auto d-inline-block" required>
                     <option value="" disabled selected>Select Semester</option>
                     <option value="1">1</option>
                     <option value="2">2</option>
                     <option value="3">3</option>
                     <option value="4">4</option>
                     </select><br>
                    <input list="subjectList" class="form-control mb-2" placeholder="Start typing subject..." id="subject" disabled required>

                     <datalist id="subjectList"></datalist>
                     <br>
                    <input type="number" class="form-control mb-2" placeholder="Attendance" id="attendance" max="100"
                        required><br>
                    <input type="number" class="form-control mb-2" placeholder="Internal1" id="internal1" max="50"
                        required><br>
                    <input type="number" class="form-control mb-2" placeholder="Internal2" id="internal2" max="50"
                        required><br>
                    <input type="number" class="form-control mb-2" placeholder="Internal3" id="internal3" max="50"
                        required><br>
                    <input type="number" class="form-control mb-2" placeholder="Assignment" id="assignment" max="10"
                        required><br>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Add</button>
